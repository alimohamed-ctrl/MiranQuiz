<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>اختبار موظفين مبيعات مران</title>
    <style>
        :root {
            --bg-color: #f8fafc;
            --card-bg: #ffffff;
            --text-color: #0f172a;
            --text-muted: #64748b;
            --primary: #0284c7;
            --primary-hover: #0369a1;
            --success: #22c55e;
            --danger: #ef4444;
            --border-color: #e2e8f0;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-color: #f8fafc;
            --text-muted: #94a3b8;
            --primary: #38bdf8;
            --primary-hover: #0ea5e9;
            --border-color: #334155;
            --shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        body {
            font-family: 'Segoe UI', Roboto, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            margin: 0;
            padding: 40px 20px;
            line-height: 1.6;
            transition: background-color 0.3s, color 0.3s;
        }

        .container {
            max-width: 760px;
            margin: 0 auto;
            background: var(--card-bg);
            padding: 40px;
            border-radius: 16px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            position: relative;
        }

        .theme-toggle {
            position: absolute;
            top: 20px;
            left: 20px;
            background: var(--border-color);
            border: none;
            padding: 8px 12px;
            border-radius: 20px;
            cursor: pointer;
            color: var(--text-color);
            font-weight: 600;
            font-size: 13px;
            z-index: 101;
        }

        .date-badge {
            display: inline-block;
            background: rgba(2, 132, 199, 0.1);
            color: var(--primary);
            padding: 6px 16px;
            border-radius: 20px;
            font-weight: 700;
            font-size: 14px;
            margin-bottom: 15px;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        /* شريط التحكم الثابت بالأعلى */
        .sticky-header {
            position: sticky;
            top: 0;
            background: var(--card-bg);
            padding: 15px 0;
            border-bottom: 2px solid var(--border-color);
            z-index: 100;
            margin-bottom: 35px;
            transition: background-color 0.3s;
        }

        .header-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 12px;
            font-weight: 700;
            font-size: 14px;
        }

        /* الحالات المتغيرة لصندوق التايمر */
        .timer-box {
            color: var(--primary);
            background: rgba(2, 132, 199, 0.08);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(2, 132, 199, 0.2);
            transition: all 0.3s ease;
        }
        
        .timer-box.urgent {
            color: var(--danger) !important;
            background: rgba(239, 68, 68, 0.15) !important;
            border-color: var(--danger) !important;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { opacity: 1; }
            50% { opacity: 0.7; }
            100% { opacity: 1; }
        }

        .progress-box {
            color: var(--primary);
            background: rgba(2, 132, 199, 0.08);
            padding: 6px 14px;
            border-radius: 8px;
            border: 1px solid rgba(2, 132, 199, 0.2);
        }

        .progress-bar-container {
            width: 100%;
            height: 8px;
            background: var(--border-color);
            border-radius: 4px;
            overflow: hidden;
            margin-bottom: 15px;
        }

        .progress-bar-fill {
            width: 0%;
            height: 100%;
            background: var(--primary);
            transition: width 0.3s ease;
        }

        /* بار الدوائر الرقمية للتنقل بين الأسئلة */
        .nav-circles-container {
            display: flex;
            justify-content: center;
            gap: 10px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .nav-circle {
            width: 36px;
            height: 36px;
            border-radius: 50%;
            background: var(--bg-color);
            border: 2px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 14px;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .nav-circle.active {
            border-color: var(--primary);
            color: var(--primary);
            background: rgba(2, 132, 199, 0.1);
            transform: scale(1.1);
        }

        .nav-circle.answered {
            background: var(--success);
            border-color: var(--success);
            color: white;
        }

        h1 { font-size: 26px; text-align: center; margin: 0 0 10px 0; font-weight: 700; }
        .subtitle { text-align: center; color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }

        .input-group {
            margin-bottom: 30px;
            background: rgba(148, 163, 184, 0.05);
            padding: 20px;
            border-radius: 12px;
            border: 1px solid var(--border-color);
        }

        label { font-weight: 600; display: block; margin-bottom: 10px; color: var(--primary); }
        
        input[type="text"] {
            width: 100%; padding: 12px 16px; background-color: var(--card-bg);
            border: 2px solid var(--border-color); border-radius: 8px; box-sizing: border-box;
            font-size: 16px; color: var(--text-color);
        }

        .question-block {
            background: rgba(148, 163, 184, 0.02); padding: 25px; border-radius: 12px;
            margin-bottom: 25px; border: 1px solid var(--border-color); border-right: 5px solid var(--primary);
            min-height: 200px;
        }

        .option-label {
            display: flex; align-items: center; padding: 12px 16px; margin: 10px 0;
            background: var(--bg-color); border: 1px solid var(--border-color); border-radius: 8px;
            cursor: pointer; transition: all 0.2s;
        }

        .option-label input[type="radio"] { margin-left: 12px; accent-color: var(--primary); width: 18px; height: 18px; }
        
        /* أزرار التنقل السفلي */
        .action-buttons {
            display: flex;
            justify-content: space-between;
            gap: 15px;
            margin-top: 20px;
        }

        .correct-opt { border-color: var(--success) !important; background: rgba(34, 197, 94, 0.1) !important; color: var(--success) !important; font-weight: 600; }
        .wrong-opt { border-color: var(--danger) !important; background: rgba(239, 68, 68, 0.1) !important; color: var(--danger) !important; font-weight: 600; }
        .feedback-text { margin-top: 10px; font-size: 14px; font-weight: 600; }
        .text-success { color: var(--success); }
        .text-danger { color: var(--danger); }

        .score-circle {
            width: 120px; height: 120px; border-radius: 50%; background: rgba(2, 132, 199, 0.1);
            border: 4px solid var(--primary); display: flex; flex-direction: column; justify-content: center;
            align-items: center; margin: 20px auto; font-size: 24px; font-weight: 700;
        }
        .score-circle span { font-size: 14px; color: var(--text-muted); font-weight: 400; }

        button.main-btn {
            display: block; width: 100%; padding: 16px; background: var(--primary); color: white;
            border: none; border-radius: 8px; font-size: 16px; cursor: pointer; font-weight: 700; transition: background 0.2s;
        }
        button.main-btn:hover { background: var(--primary-hover); }
        button.main-btn:disabled { background: var(--text-muted); cursor: not-allowed; opacity: 0.6; }
        
        .footer { text-align: center; margin-top: 30px; font-size: 12px; color: var(--text-muted); }
    </style>
</head>
<body>

<div class="container">
    <button class="theme-toggle" onclick="toggleTheme()" id="themeBtn">🌙 وضع داكن</button>

    <div id="login-view" style="text-align: center;">
        <h1>اختبار موظفين مبيعات مران</h1>
        <div class="subtitle">نظام الجدولة الذكي وتقييم الأداء الفوري للفرع</div>
        
        <div class="date-badge" id="topDateBadge">جاري حساب تاريخ اليوم...</div>

        <div class="input-group" style="text-align: right;">
            <label for="employee-name">اسم الموظف بالكامل:</label>
            <input type="text" id="employee-name" placeholder="أدخل اسمك ثلاثياً أو رباعياً للبدء">
        </div>
        
        <button id="start-btn" class="main-btn" onclick="startQuiz()" disabled>جاري تأمين الاتصال بالسيرفر... 🔄</button>
    </div>

    <div id="quiz-view" style="display: none;">
        <div class="sticky-header" id="quizHeader">
            <div class="header-meta">
                <div class="timer-box" id="timerBox">⏱️ الوقت المتبقي: <span id="timerText">15:00</span></div>
                <div class="progress-box">نسبة الإنجاز: <span id="progressPercent">0%</span></div>
            </div>
            <div class="progress-bar-container">
                <div class="progress-bar-fill" id="progressBarFill"></div>
            </div>
            
            <div class="nav-circles-container" id="navCirclesContainer"></div>
        </div>

        <div id="quiz-container"></div>

        <div class="action-buttons">
            <button id="prev-btn" class="main-btn" style="background: var(--border-color); color: var(--text-color);" onclick="prevQuestion()">السابق</button>
            <button id="next-btn" class="main-btn" onclick="nextQuestion()">التالي</button>
            <button id="submit-btn" class="main-btn" style="background: var(--success); display: none;" onclick="submitQuiz(false)">إنهاء وإرسال الإجابات</button>
        </div>
    </div>

    <div id="result-view" style="display: none;">
        <h1>تقرير الأداء النهائي</h1>
        <div class="subtitle" id="employee-greeting"></div>
        <div class="score-circle" id="percentageCircle">0% <span>النسبة المئوية</span></div>
        <p style="text-align: center; font-weight: 600;" id="totalScoreText"></p>
        <hr style="border: 0; border-top: 1px solid var(--border-color); margin: 30px 0;">
        <h2 style="font-size: 18px; margin-bottom: 20px;">مراجعة ورقة الإجابة التفصيلية:</h2>
        <div id="review-container"></div>
    </div>
    
    <div class="footer">منصة مران للمبيعات الرقمية © 2026</div>
</div>

<script src="script.js"></script>
</body>
</html>
